<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="50%" stop-color="#af1890" />
      <stop offset="100%" stop-color="#3a1c71" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" />
  <g opacity="0.12" fill="#000">
    <circle cx="300" cy="200" r="220" />
    <circle cx="800" cy="150" r="160" />
    <circle cx="1400" cy="300" r="200" />
  </g>
  <g transform="translate(0,600) scale(1,0.6)" fill="rgba(0,0,0,0.18)">
    <ellipse cx="200" cy="100" rx="320" ry="80" />
    <ellipse cx="700" cy="40" rx="420" ry="90" />
    <ellipse cx="1200" cy="120" rx="360" ry="70" />
  </g>
  <g fill="#fff" opacity="0.14">
    <rect x="60" y="420" width="220" height="6" rx="3"/>
    <rect x="120" y="460" width="180" height="6" rx="3"/>
    <rect x="160" y="500" width="140" height="6" rx="3"/>
  </g>
  <text x="80" y="860" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="48" font-weight="700" opacity="0.9">Experience events like never before</text>
</svg>